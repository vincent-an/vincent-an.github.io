<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Dev Blog</title>

    <style>
        /* 전체 배경 (우주 느낌) */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0a0a23, #000);
            color: #e0e0ff;
        }

        /* 별 효과 */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.3;
            z-index: -1;
        }

        /* 레이아웃 */
        .container {
            display: flex;
            height: 100vh;
        }

        /* 사이드바 (프로필) */
        .sidebar {
            width: 280px;
            background: rgba(10, 10, 35, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            box-shadow: 2px 0 20px rgba(0,0,0,0.5);
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .profile h2 {
            margin: 10px 0 5px;
            color: #caa6ff;
        }

        .profile p {
            font-size: 14px;
            color: #aaa;
        }

        /* 메인 콘텐츠 */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
            color: #d0b3ff;
        }

        /* 게시글 카드 */
        .post {
            background: rgba(20, 20, 60, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .post:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(100, 50, 255, 0.3);
        }

        .post h3 {
            margin: 0;
            color: #ffffff;
        }

        .post p {
            font-size: 14px;
            color: #bbb;
        }

        .post span {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 사이드바 -->
    <div class="sidebar">
        <div class="profile">
            <img src="https://via.placeholder.com/100" alt="profile">
            <h2>정수</h2>
            <p>백엔드 개발자 🚀</p>
            <p>Java | Spring | AWS</p>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main">
        <div class="title">🌌 Dev Log</div>

        <div class="post">
            <h3>JDBC에서 Connection 관리 제대로 하기</h3>
            <p>Connection을 닫지 않으면 어떤 문제가 발생하는지와 해결 방법을 정리했습니다.</p>
            <span>2026.03.17</span>
        </div>

        <div class="post">
            <h3>MVC 패턴 제대로 이해하기</h3>
            <p>Controller, Service, DAO 역할을 실전 코드 기준으로 정리했습니다.</p>
            <span>2026.03.15</span>
        </div>

        <div class="post">
            <h3>MySQL 인덱스 최적화 경험</h3>
            <p>조회 속도를 3배 개선했던 인덱스 적용 사례를 공유합니다.</p>
            <span>2026.03.10</span>
        </div>

    </div>

</div>

</body>
</html>
