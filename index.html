<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Blog</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #0a0a23, #000);
    color: #e0e0ff;
    overflow-x: hidden;
}

/* 별 애니메이션 */
.stars, .stars::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
    animation: twinkle 5s infinite linear;
    opacity: 0.5;
    z-index: -2;
}

@keyframes twinkle {
    from {opacity: 0.3;}
    to {opacity: 0.7;}
}

/* 유성 */
.shooting-star {
    position: fixed;
    width: 2px;
    height: 100px;
    background: linear-gradient(white, transparent);
    top: -100px;
    left: 50%;
    animation: shoot 5s infinite ease-in;
    z-index: -1;
}

@keyframes shoot {
    0% {transform: translate(0,0) rotate(45deg); opacity:1;}
    100% {transform: translate(-500px,800px) rotate(45deg); opacity:0;}
}

/* 상단 메뉴바 */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    height: 60px;
    background: rgba(10,10,35,0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
}

.navbar .menu a {
    margin-right: 20px;
    color: #caa6ff;
    text-decoration: none;
}

.navbar .stats {
    font-size: 14px;
    color: #aaa;
}

.container {
    display: flex;
    margin-top: 60px;
}

.sidebar {
    width: 260px;
    padding: 20px;
}

.profile-box {
    margin-top: 150px;
    background: rgba(20,20,60,0.7);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    text-align: center;
}

.profile-box img {
    width: 80px;
    border-radius: 50%;
}

.main {
    flex: 1;
    padding: 30px;
}

.post {
    background: rgba(20,20,60,0.6);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.05);
}

.post:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(100,50,255,0.3);
}

/* 반응형 */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .profile-box {
        margin-top: 50px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="shooting-star"></div>

<div class="navbar">
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Posts</a>
        <a href="#">About</a>
    </div>
    <div class="stats">
        게시글 10개 | 방문자 1234명
    </div>
</div>

<div class="container">

    <div class="sidebar">
        <div class="profile-box">
            <img src="https://via.placeholder.com/80">
            <h3>정수</h3>
            <p>백엔드 개발자</p>
        </div>
    </div>

    <div class="main">
        <div class="post">
            <h3>JDBC Connection 관리</h3>
            <p>Connection 관리 방법 정리</p>
        </div>

        <div class="post">
            <h3>MVC 패턴 이해</h3>
            <p>구조와 흐름 정리</p>
        </div>
    </div>

</div>

</body>
</html>
